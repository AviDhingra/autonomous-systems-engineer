<section id="job-status" class="status-panel"
  {%- if active %} hx-get="/jobs/{{ job.id }}/status" hx-trigger="every 3s" hx-swap="outerHTML"{% endif %}>
  <span class="badge {{ badge }} badge-lg">{{ label }}</span>
  <dl class="facts inline">
    <div>
      <dt>Retries used</dt>
      <dd class="{{ 'over' if budget.retries_exhausted }}">{{ budget.retries_used }} / {{ budget.max_retries }}</dd>
    </div>
    <div>
      <dt>Time used</dt>
      <dd class="{{ 'over' if budget.wall_clock_exceeded }}">{{ budget.elapsed_label }} / {{ budget.max_wall_clock_label }}</dd>
    </div>
  </dl>
</section>

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autonomous-systems-engineer"
version = "0.1.0"
description = "Checkpoint 1 FleetOps backend for the Verified Engineering Agent project."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "langgraph>=1.2,<2",
  "langchain-anthropic>=1.1,<2",
  "langchain-ollama>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/ase", "target/fleetops"]

[tool.pytest.ini_options]
testpaths = ["tests", "target/fleetops/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_generics = true
